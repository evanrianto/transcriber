[project]
name = "transcriber"
version = "0.1.0"
description = "Local web app that turns video and audio Recordings into timestamped Transcripts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1",
    # faster-whisper passes `metadata_errors` to av.open(), which newer PyAV removed.
    "av>=11,<17",
    # A full ffmpeg (with H.264 encoders) for converting previews the browser can play.
    "imageio-ffmpeg>=0.5",
    # CUDA runtime libraries for faster-whisper's GPU path (no system CUDA install needed).
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
transcriber = "transcriber.cli:main"
transcriber-download-model = "transcriber.engine:download_model_cli"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real Whisper model and ffmpeg (run with `make test-slow`)"]
addopts = "-m 'not slow'"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "imageio_ffmpeg.*", "nvidia.*"]
ignore_missing_imports = true
